name: Release upstream

# Merges each new stable release of abue-ammar/tinycast into main, builds the result, publishes it here.
on:
  schedule:
    - cron: "* 0 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Upstream tag to build instead of the latest release (e.g. v0.12.15)"
        type: string
        required: false

permissions:
  contents: write

concurrency:
  group: release-upstream
  cancel-in-progress: false

env:
  UPSTREAM: abue-ammar/tinycast

jobs:
  release:
    runs-on: macos-26
    steps:
      - name: Find the upstream release
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="${INPUT_TAG:-$(gh release view --repo "$UPSTREAM" --json tagName --jq .tagName)}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$TAG is already released here."
            echo "new=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          NOTES="$(gh release view "$TAG" --repo "$UPSTREAM" --json body --jq .body)"
          printf '%s\n' "$NOTES" > "$RUNNER_TEMP/notes.md"
          {
            echo "new=true"
            echo "tag=$TAG"
            echo "version=${TAG#v}"
          } >> "$GITHUB_OUTPUT"

      - name: Check out this repo
        if: steps.upstream.outputs.new == 'true'
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Merge upstream
        id: merge
        if: steps.upstream.outputs.new == 'true'
        env:
          TAG: ${{ steps.upstream.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch "https://github.com/$UPSTREAM.git" "refs/tags/$TAG:refs/tags/upstream-$TAG"
          # --no-commit: this repo's workflow is its own, so upstream's must never replace it.
          git merge --no-commit --no-ff "upstream-$TAG" || true
          git rm -rq --ignore-unmatch .github/workflows
          git checkout HEAD -- .github/workflows
          if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
            echo "::error::Merging $TAG conflicts; resolve it by hand:"
            git diff --name-only --diff-filter=U
            exit 1
          fi
          git commit -m "Merge upstream $TAG" || echo "Nothing to merge."
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Select the newest Xcode
        if: steps.upstream.outputs.new == 'true'
        run: |
          XCODE_PATH="$(find -E /Applications -maxdepth 1 -type d -regex '.*/Xcode_[0-9]+(\.[0-9]+)*\.app' | sort -V | tail -n1)"
          echo "Using $XCODE_PATH"
          echo "DEVELOPER_DIR=$XCODE_PATH/Contents/Developer" >> "$GITHUB_ENV"

      - name: Build app
        if: steps.upstream.outputs.new == 'true'
        env:
          VERSION: ${{ steps.upstream.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          xcodebuild -project Tinycast.xcodeproj -scheme Tinycast -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="-" DEVELOPMENT_TEAM="" \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            build

      - name: Package
        if: steps.upstream.outputs.new == 'true'
        env:
          VERSION: ${{ steps.upstream.outputs.version }}
        run: |
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release/Tinycast.app"
          mkdir -p dist "$RUNNER_TEMP/stage"
          cp -R "$APP" "$RUNNER_TEMP/stage/"
          ln -s /Applications "$RUNNER_TEMP/stage/Applications"
          hdiutil create -volname Tinycast -srcfolder "$RUNNER_TEMP/stage" -format UDZO "dist/Tinycast-${VERSION}.dmg"
          ditto -c -k --keepParent --sequesterRsrc "$APP" "dist/Tinycast-${VERSION}.zip"

      - name: Publish release
        if: steps.upstream.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.upstream.outputs.tag }}
          VERSION: ${{ steps.upstream.outputs.version }}
          SHA: ${{ steps.merge.outputs.sha }}
        run: |
          gh release create "$TAG" "dist/Tinycast-${VERSION}.dmg" "dist/Tinycast-${VERSION}.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SHA" \
            --title "Tinycast $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md"
